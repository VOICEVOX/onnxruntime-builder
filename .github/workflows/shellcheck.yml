name: ShellCheck

on:
  - push
  - pull_request

jobs:
  shellcheck:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Update ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck -V

      - name: ShellCheck
        run: git ls-files | grep -E '\.(ba)?sh' | xargs shellcheck
